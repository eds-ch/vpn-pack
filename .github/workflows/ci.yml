name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: manager/ui/package-lock.json

      - name: Fetch Tailscale source
        run: make fetch-tailscale

      - name: Install UI dependencies
        run: cd manager/ui && npm ci

      - name: svelte-check
        run: cd manager/ui && npx svelte-check

      - name: vitest
        run: cd manager/ui && npx vitest run

      - name: Create UI stub for go:embed
        run: make ui-stub

      - name: go vet
        run: cd manager && go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          working-directory: manager
          args: --config ../.golangci.yml ./...

      - name: go test
        run: cd manager && go test -race -shuffle=on -count=1 ./...

      - name: Phase 8 — installer + deploy regression tests
        run: |
          bash scripts/test-installers.sh
          bash scripts/test-deploy-symlink.sh
          bash scripts/test-uninstall-integrity.sh
          bash scripts/test-systemd-hardening.sh

      - name: Phase 8 — TLS pinning guard
        run: ./scripts/check-tls-pinning.sh

      - name: Phase 8 — WG private-key persistence guard
        run: ./scripts/check-no-key-leak.sh

      - name: Phase 8 — nginx config symmetry guard
        run: ./deploy/check-nginx-symmetry.sh

      - name: Phase 9 — subprocess context guard
        run: ./scripts/check-no-background-exec.sh

      - name: Build (cross-compile ARM64)
        run: make build

      - name: Package
        run: make package

      - name: Verify package version
        run: |
          VERSION=$(cat VERSION)
          test -f "build/dist/vpn-pack-${VERSION}.tar.gz"
