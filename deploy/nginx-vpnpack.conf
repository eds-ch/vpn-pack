# Tailscale Manager - served behind UniFi auth
# Installed to: /data/unifi-core/config/http/shared-runnable-vpnpack.conf
#
# Manager listens on /run/vpn-pack/manager.sock (unix socket, mode 0660,
# root:nginx). Peer-credential auth at the app layer enforces a uid
# allow-list; this file forwards authenticated UniFi-OS requests through.
#
# X-VpnPack-Token carries a per-install shared secret (generated by
# install.sh into /persistent/vpn-pack/config/nginx-token). The manager
# validates it as a defense-in-depth factor on top of the peer-uid check
# (M1). install.sh substitutes the real secret for __VPNPACK_NGINX_TOKEN__
# at install time; the placeholder must never be committed with a real
# value. NOTE: this secret lives in this nginx config, which the nginx
# worker reads — so against RCE in the worker itself it is defense-in-
# depth, not a hard boundary.

location /vpn-pack/api/ {
    include /usr/share/unifi-core/http/cors.conf;
    include /usr/share/unifi-core/http/security.conf;
    include /usr/share/unifi-core/http/auth.conf;
    include /usr/share/unifi-core/http/proxy.conf;

    proxy_set_header X-VpnPack-Token __VPNPACK_NGINX_TOKEN__;

    proxy_pass http://unix:/run/vpn-pack/manager.sock:/api/;
}

location /vpn-pack/ {
    include /usr/share/unifi-core/http/cors.conf;
    include /usr/share/unifi-core/http/security.conf;
    include /usr/share/unifi-core/http/auth.conf;
    include /usr/share/unifi-core/http/proxy.conf;

    proxy_set_header X-VpnPack-Token __VPNPACK_NGINX_TOKEN__;

    error_page 401 403 =302 /;

    proxy_pass http://unix:/run/vpn-pack/manager.sock:/;
}
